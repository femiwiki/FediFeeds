  WikvenFooterUrl: https://github.com/femiwiki/FediFeeds
  WikvenEditUrl: https://github.com/femiwiki/FediFeeds/edit/main/docs/$1
  WikvenHistoryUrl: https://github.com/femiwiki/FediFeeds/commits/main/docs/$1
  WikvenViewSourceUrl: https://github.com/femiwiki/FediFeeds/blob/main/docs/$1
  WikvenRepositories:
    Citizen:
      repository: https://github.com/StarCitizenTools/mediawiki-skins-Citizen.git
      reference: v3.24.0
