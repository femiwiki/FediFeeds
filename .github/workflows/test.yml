---
name: Test
on:
  workflow_call:
permissions: {}
jobs:
  quibble:
    strategy:
      fail-fast: false
      matrix:
        # The list shares one wiki; phan installs none
        stage: [phan, "composer-test,phpunit-unit,phpunit"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: femiwiki/quibble-action@2b5f2466dec6f421394630fd653445da1f86b11c  # v3.0.0
        with:
          stage: ${{ matrix.stage }}
          mediawiki-version: REL1_46
          # Translate is optional; with it the tests of translation pages run
          # and phan sees its classes. It requires UniversalLanguageSelector.
          dependencies: Translate UniversalLanguageSelector
