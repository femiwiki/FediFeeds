---
name: Required
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@5b2ac3da712fc79c09e58ac0a8999f862bd7a7f0
    permissions:
      contents: read

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: chaotic-ground/wikven/actions/bake@75d325babd714624999a29977ec273b0d3e1036c  # v1.4.2
        with:
          source: docs
          output: dist

      # Fails on a source page Translate cannot read; a translation that is behind is only annotated
      - uses: chaotic-ground/wikven/actions/check-translations@75d325babd714624999a29977ec273b0d3e1036c  # v1.4.2
        with:
          source: docs

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [test, shared-lint, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
